name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Publish (${{ matrix.platform }})
    # 使用 environment 层的密钥（TAURI_SIGNING_PRIVATE_KEY 等），与仓库层 secret 隔离。
    # environment "release" 应在仓库 Settings → Environments 创建，并配置：
    #   - Deployment branches: Selected branches → 只允许 tag v* 触发
    #   - Required reviewers: 至少 1 人 approve（多人协作时启用）
    environment: release
    # job 级最小权限：tauri-action 创建/编辑 Release 需要 contents: write，其它一律不给。
    # 显式列出避免 GITHUB_TOKEN 拿到隐式 actions/packages 等权限。
    permissions:
      contents: write
    strategy:
      # 单个平台失败不阻塞另一个平台产出 release 资产
      fail-fast: false
      matrix:
        include:
          # Windows x64：NSIS installer（updaterJsonPreferNsis=true 让 latest.json 优先匹配）
          - platform: windows
            os: windows-latest
            args: --target x86_64-pc-windows-msvc
          # macOS arm64（Apple Silicon）：dmg + .app.tar.gz
          # 当前未配 codesign/notarization，产物为 ad-hoc 签名，首次启动会有 Gatekeeper 警告。
          # 端到端运行验证留待以后有 macOS 验证环境补；本次只确保 CI 编译通过。
          - platform: macos
            os: macos-latest
            args: --target aarch64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - name: Install make + Git Bash（make check-lint 需要 bash；仅 Windows）
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          choco install make --no-progress -y
          $gitBash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path $gitBash)) {
            throw "Git Bash not found at $gitBash"
          }
          Add-Content $env:GITHUB_PATH 'C:\Program Files\Git\bin'

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check command tools（仅 Windows）
        if: matrix.platform == 'windows'
        run: |
          make --version
          bash --version

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gate（仅 Windows：Makefile 是 PowerShell-only）
        if: matrix.platform == 'windows'
        run: make check-lint

      - name: Build Tauri bundles + sign + upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater 签名密钥（一次性本地 tauri signer generate 生成，
          # 私钥 + 密码存到 environment "release" secret）。pubkey 已写入
          # src-tauri/tauri.conf.json 的 plugins.updater.pubkey。
          # 跨平台通用：同一组密钥同时签 Windows .nsis.zip.sig 和 macOS .app.tar.gz.sig。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DDNet-Manager ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          # updater 优先匹配 NSIS installer（仅 Windows；macOS 不适用）
          updaterJsonPreferNsis: ${{ matrix.platform == 'windows' }}
          # 用 bun 跑 tauri CLI（与 Makefile/CLAUDE.md 的 bun 优先约束一致）
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
